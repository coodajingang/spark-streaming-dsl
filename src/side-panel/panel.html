<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>调试面板</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        margin: 0;
        padding: 12px;
        color: #202124;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      .tab-btn {
        padding: 6px 10px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
      }

      .tab-btn.active {
        border-color: #1a73e8;
        color: #1a73e8;
      }

      .tab-content {
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 10px;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
      }

      input[type='text'],
      textarea,
      select {
        width: 100%;
        border: 1px solid #dadce0;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 13px;
        box-sizing: border-box;
      }

      textarea {
        min-height: 70px;
        resize: vertical;
      }

      button {
        padding: 6px 10px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
      }

      button.primary {
        border-color: #1a73e8;
        background: #1a73e8;
        color: #fff;
      }

      pre {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 10px;
        overflow: auto;
        max-height: 40vh;
      }

      .config-group {
        margin: 10px 0;
      }

      .config-group label {
        display: block;
        font-size: 12px;
        color: #5f6368;
        margin-bottom: 6px;
      }

      .config-buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .muted {
        color: #5f6368;
        font-size: 12px;
      }

      #logs-controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }

      #logs-content {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h2>调试 Side Panel</h2>

    <div class="tabs">
      <button class="tab-btn active" data-tab="request">请求数据</button>
      <button class="tab-btn" data-tab="config">配置</button>
      <button class="tab-btn" data-tab="logs">日志</button>
    </div>

    <!-- Tab 1: 请求数据 -->
    <section id="request-section" class="tab-content">
      <h3>最新拦截请求</h3>
      <pre id="latest-request">加载中...</pre>

      <div class="row">
        <button id="refresh-requests-btn">刷新数据</button>
        <button id="clear-history-btn">清除历史</button>
      </div>

      <h3>发送请求</h3>
      <div class="config-group">
        <label>URL</label>
        <input id="request-url-input" type="text" placeholder="https://jsonplaceholder.typicode.com/posts/1" />
      </div>
      <div class="config-group">
        <label>POST Body（JSON，可选）</label>
        <textarea id="request-body-input" placeholder="{\n  \"title\": \"foo\"\n}"></textarea>
      </div>
      <div class="row">
        <button id="send-get-btn" class="primary">发送 GET</button>
        <button id="send-post-btn" class="primary">发送 POST</button>
      </div>

      <h3>响应</h3>
      <pre id="send-result">等待发送...</pre>
      <p class="muted">提示：若直接发送失败（例如 CORS），将自动通过 Service Worker 代理。</p>
    </section>

    <!-- Tab 2: 配置管理 -->
    <section id="config-section" class="tab-content" style="display: none">
      <h3>配置管理</h3>

      <div id="config-form">
        <div class="config-group">
          <label>页面元素选择器（每行一个）:</label>
          <textarea id="selectors-input" placeholder="li\n.list-item\n[data-item]"></textarea>
        </div>

        <div class="config-group">
          <label>拦截请求 URL（每行一个）:</label>
          <textarea
            id="intercept-urls-input"
            placeholder="https://jsonplaceholder.typicode.com/posts/1"
          ></textarea>
        </div>

        <div class="config-group">
          <label>日志级别:</label>
          <select id="log-level-select">
            <option value="DEBUG">DEBUG</option>
            <option value="INFO">INFO</option>
            <option value="WARN">WARN</option>
            <option value="ERROR">ERROR</option>
          </select>
        </div>

        <div class="config-buttons">
          <button id="save-config-btn" class="primary">保存配置</button>
          <button id="reset-config-btn">恢复默认</button>
          <button id="export-config-btn">导出配置</button>
          <button id="clear-logs-btn">清除日志</button>
        </div>

        <p class="muted" id="config-status"></p>
      </div>
    </section>

    <!-- Tab 3: 日志面板 -->
    <section id="logs-section" class="tab-content" style="display: none">
      <h3>调试日志</h3>
      <div id="logs-controls">
        <button id="refresh-logs-btn">刷新日志</button>
        <button id="export-logs-btn">导出日志</button>
        <select id="log-filter-select">
          <option value="">全部</option>
          <option value="ERROR">错误</option>
          <option value="WARN">警告</option>
          <option value="INFO">信息</option>
          <option value="DEBUG">调试</option>
        </select>
      </div>
      <div id="logs-display">
        <pre id="logs-content">加载中...</pre>
      </div>
    </section>

    <script type="module" src="./panel.js"></script>
  </body>
</html>
